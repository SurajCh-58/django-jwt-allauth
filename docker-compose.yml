services:

  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  web:
    build:
      context: .
      args:
        UID: ${UID}
        GID: ${GID}

    command: gunicorn AuthProject.wsgi:application --bind 0.0.0.0:8000 --workers 3

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

  frontend:
    build: ./auth-frontend
    ports:
      - "3000:80"
    depends_on:
      - web

volumes:
  postgres_data: